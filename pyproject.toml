[project]
name = "cackalacky-ai-village-2026"
version = "1.0.0"
description = "CackalackyCon 2026 AI Village — Build Your Own Security Agent Workshop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"

dependencies = [
    "langchain>=0.3.0",
    "langchain-ollama>=1.0.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "duckduckgo-search>=6.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]